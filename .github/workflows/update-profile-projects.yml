name: Update profile featured projects

# Regenerates ONLY the section between
#   <!-- FEATURED_PROJECTS:START --> and <!-- FEATURED_PROJECTS:END -->
# in README.md, using scripts/update-projects.mjs.
#
# Committing is conditional (step "Commit and push"): if the generated section
# matches what is already in README.md, the script reports "No changes" and the
# workflow exits cleanly without creating an empty commit.
#
# Repository setting required (Settings → Actions → General → Workflow
# permissions):
#   * "Read and write permissions" must be selected, OR
#   * keep the default (read-only) and the `permissions:` block below will
#     still request contents: write per-run on repos that allow it.
# If pushes are blocked, also check Settings → Actions → General →
# "Allow GitHub Actions to create and approve pull requests" is not needed for
# a direct push to the default branch, but branch protection on main must
# either allow the github-actions bot to push or the workflow will fail.
#
# Required secret: none — the built-in GITHUB_TOKEN is used.

on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Generate but do not write/commit'
        required: false
        default: 'false'
  schedule:
    # Weekly, Mondays 03:11 UTC. Chosen off the hour to reduce load spikes.
    - cron: '11 3 * * 1'

permissions:
  contents: write # the minimum needed to push the regenerated README.md

concurrency:
  group: update-profile-projects
  cancel-in-progress: false

jobs:
  update-readme:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # checkout with a token that can push; the default GITHUB_TOKEN works
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: '**/package.json'

      - name: Run featured-projects generator
        env:
          # Built-in token raises the API rate limit from 60/h to 5,000/h for
          # this run. It is passed via env, never echoed to logs.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USER: KanekiDevPro
        run: |
          if [ "${{ github.event.inputs.dry-run || 'false' }}" = "true" ]; then
            node scripts/update-projects.mjs --dry-run --verbose
          else
            node scripts/update-projects.mjs --verbose
          fi

      - name: Commit and push (only if changed)
        id: commit
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { execSync } = require('child_process');
            const status = execSync('git status --porcelain README.md').toString().trim();
            if (!status) {
              console.log('README unchanged — nothing to commit.');
              return;
            }
            execSync('git config user.name "github-actions[bot]"');
            execSync('git config user.email "41898282+github-actions[bot]@users.noreply.github.com"');
            execSync('git add README.md');
            execSync('git commit -m "chore(profile): refresh featured projects [skip ci]"');
            execSync('git push origin HEAD:${{ github.ref_name }}');
            console.log('Pushed updated README.md');

      - name: Job summary
        if: always()
        run: |
          {
            echo "## Featured projects update"
            echo ""
            echo "- Result: ${{ steps.commit.outcome == 'success' && 'OK' || steps.commit.outcome }}"
            echo "- Dry run: ${{ github.event.inputs.dry-run || 'false' }}"
            echo "- Schedule: weekly (cron 11 3 * * 1)"
          } >> "$GITHUB_STEP_SUMMARY"

name: Update profile featured projects

# Regenerates ONLY the section between
#   <!-- FEATURED_PROJECTS:START --> and <!-- FEATURED_PROJECTS:END -->
# in README.md, using scripts/update-projects.mjs.
#
# Requirements:
#   - File `scripts/update-projects.mjs` must exist in this repo (preflight
#     step fails with clear instructions if it does not).
#   - Repo setting: Settings → Actions → General → Workflow permissions →
#     "Read and write permissions" (needed for the push step).
#   - No secrets required — the built-in GITHUB_TOKEN is used.

on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Generate but do not write/commit'
        required: false
        default: 'false'
  schedule:
    # Weekly, Mondays 03:11 UTC.
    - cron: '11 3 * * 1'

permissions:
  contents: write

concurrency:
  group: update-profile-projects
  cancel-in-progress: false

jobs:
  update-readme:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Preflight — verify required files exist
        run: |
          missing=0
          for f in scripts/update-projects.mjs README.md; do
            if [ ! -f "$f" ]; then
              echo "::error::Required file is missing: $f"
              echo "  → Upload it to the ROOT of this repository, preserving the path."
              echo "  → Current repository layout:"
              find . -path ./.git -prune -o -type f -print | sed 's/^/      /'
              missing=1
            fi
          done
          if [ "$missing" = "1" ]; then
            exit 1
          fi
          echo "Preflight OK: scripts/update-projects.mjs and README.md found."

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Run featured-projects generator
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USER: KanekiDevPro
          DRY_RUN: ${{ github.event.inputs.dry-run || 'false' }}
        run: node scripts/update-projects.mjs --verbose

      - name: Commit and push (only if changed)
        id: commit
        run: |
          if [ "${DRY_RUN:-false}" = "true" ]; then
            echo "Dry-run mode — skipping commit (as requested)."
            echo "committed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$(git status --porcelain README.md)" ]; then
            echo "README unchanged — nothing to commit."
            echo "committed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore(profile): refresh featured projects [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          echo "committed=true" >> "$GITHUB_OUTPUT"

      - name: Job summary
        if: always()
        run: |
          {
            echo "## Featured projects update"
            echo ""
            echo "- Dry run: ${DRY_RUN:-false}"
            echo "- Committed: ${{ steps.commit.outputs.committed != 'true' && 'no (unchanged or dry-run)' || 'yes' }}"
            echo "- Schedule: weekly (cron 11 3 * * 1)"
          } >> "$GITHUB_STEP_SUMMARY"
